spring:
  application:
    name: ${application.name}
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUDNAME:}
  api-key: ${CLOUDINARY_APIKEY:}
  api-secret: ${CLOUDINARY_APISECRET:}
application:
  name: "zamazor"
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  security:
    jwt:
      refresh:
        secret: ${REFRESH_TOKEN_SECRET_KEY:}
        expiration: 7d
      access:
        secret: ${ACCESS_TOKEN_SECRET_KEY:}
        expiration: 15m
      issuer: auth-service
  stripe:
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    secret-key: ${STRIPE_SECRET_KEY:}
  mail:
    personal-name: "Zamazor Support"
    from-address: ${SMTP_USER:}
  support-email: ${SUPPORT_EMAIL:}
  support-phone: ${SUPPORT_PHONE:}