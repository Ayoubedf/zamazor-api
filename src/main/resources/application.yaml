spring:
  application:
    name: zamazor
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    jwt:
      refresh:
        secret: ${REFRESH_TOKEN_SECRET_KEY:}
        expiration: 7d
      access:
        secret: ${ACCESS_TOKEN_SECRET_KEY:}
        expiration: 15m
      issuer: auth-service